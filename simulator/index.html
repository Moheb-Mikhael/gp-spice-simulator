<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPICE Web Simulator</title>
    <meta name="description" content="A powerful SPICE circuit simulator running entirely in your browser via WebAssembly. No server needed.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header id="header">
        <div class="logo-area">
            <h1>SPICE Web Simulator</h1>
            <span class="subtitle">Circuit Simulation in Your Browser</span>
        </div>
    </header>

    <div id="toolbar">
        <button id="btn-run" class="btn btn-primary" disabled>
            <span class="icon">▶</span> Run Simulation
        </button>
        <select id="select-example">
            <option value="" disabled selected>Load Example...</option>
            <option value="rc_lowpass">RC Low-Pass Filter (Transient)</option>
            <option value="rlc_bandpass">RLC Band-Pass Filter (AC Bode)</option>
            <option value="diode_iv">Diode I-V Curve (DC Sweep)</option>
        </select>
        <button id="btn-clear" class="btn btn-secondary">Clear Output</button>
        <div id="status-indicator" class="status-loading">Loading WebAssembly...</div>
    </div>

    <main id="main-content">
        <section id="editor-pane">
            <div class="tab-bar">
                <div class="tab active">Netlist</div>
            </div>
            <div class="editor-container">
                <div id="line-numbers">1</div>
                <textarea id="netlist-editor" spellcheck="false" wrap="off"></textarea>
            </div>
        </section>

        <div id="resize-handle"></div>

        <section id="output-pane">
            <div class="tab-bar">
                <div id="tab-console" class="tab active">Console</div>
                <div id="tab-plot" class="tab">Plot</div>
            </div>
            <div class="output-container">
                <pre id="console-output"></pre>
                <div id="plot-container" style="display: none;">
                    <div id="chart" style="width: 100%; height: 100%;"></div>
                </div>
            </div>
        </section>
    </main>

    <footer id="footer">
        Powered by WebAssembly • All computation runs locally in your browser
    </footer>

    <script src="./spice_engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
